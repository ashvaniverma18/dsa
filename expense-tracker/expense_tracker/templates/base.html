<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Expense Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a class="brand" href="{{ url_for('main.expenses') }}">Expense Tracker</a>
      <div class="links">
        <a href="{{ url_for('main.expenses') }}">Expenses</a>
        <a href="{{ url_for('main.categories') }}">Categories</a>
        <a href="{{ url_for('main.reports') }}">Reports</a>
      </div>
    </div>
  </nav>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul class="flashes">
          {% for category, message in messages %}
            <li class="flash {{ category }}">{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <footer class="footer container">
    <p>Built with Flask + SQLite</p>
  </footer>
</body>
</html>
